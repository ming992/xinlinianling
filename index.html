  function atlas(){return `${head('THE AGE ATLAS','六种内心节奏','年龄是有趣的标签，不是评价高低的尺子。每一种类型，都有自己的力量与值得照顾的角落。')}<div class="grid-3" style="padding-bottom:80px">${TYPES.map(t=>`<article class="card type-card"><span class="eyebrow">${t.max===99?'60+':`${t.min} — ${t.max}`}</span><div class="type-age">${t.name}</div><strong>${t.tag}</strong><p style="margin-top:12px">${t.summary}</p><div class="tiny"><strong>亮点：</strong>${t.strengths[0]}<br><strong>留意：</strong>${t.blind[0]}<br><strong>练习：</strong>${t.growth}</div></article>`).join('')}</div>`}

  function historyPage(){return `${head('YOUR TIMELINE','我的测评记录','最多保存最近 20 次，按时间从近到远排序。记录只存在这个浏览器中。')}<div class="button-row no-print" style="margin-bottom:22px"><button class="btn btn-small" data-action="compare" ${compare.length!==2?'disabled':''}>对比选中的两次</button><button class="btn btn-small" data-action="clear-history" ${history.length?'':'disabled'}>清空全部记录</button></div>${history.length?`<div class="card pad">${history.map(r=>`<div class="history-item"><div><label class="checkbox-line"><input type="checkbox" data-compare-id="${esc(r.id)}" ${compare.includes(r.id)?'checked':''} aria-label="选择 ${esc(dateLabel(r.date))} 的记录用于对比"><span class="tiny">${esc(dateLabel(r.date))} · ${esc(r.mood)}</span></label><h3>${r.age} 岁 · ${esc(typeFor(r.age).name)}</h3><span class="tiny">六维平均 ${Math.round(Object.values(r.scores).reduce((a,b)=>a+b,0)/6)} / 100</span></div><div class="history-actions"><button class="btn btn-small" data-record="${esc(r.id)}">查看详情</button><button class="btn btn-small" data-delete="${esc(r.id)}">删除</button></div></div>`).join('')}</div><p class="tiny" style="margin:15px 0 70px">勾选两条记录，即可查看两次测评的变化。不同题目与当下心情都可能影响结果。</p>`:`<div class="card empty"><div class="empty-icon">✦</div><h2>这里还是一张白纸</h2><p>完成第一次测评后，结果会在这里留下一个小小的时间坐标。</p><button class="btn btn-primary" data-action="start">开始测评</button></div>`}`}
  function comparison(){const a=byId(compare[0]),b=byId(compare[1]);if(!a||!b)return historyPage();const older=a.date<b.date?a:b,newer=a.date>b.date?a:b;return `${head('TWO MOMENTS','两次测评对比',`${esc(dateLabel(older.date))} 与 ${esc(dateLabel(newer.date))}`)}<div class="compare-grid"><div class="card pad"><span class="eyebrow">EARLIER</span><h2 style="margin:12px 0">${older.age} 岁</h2><p>${esc(typeFor(older.age).name)}</p></div><div class="card pad"><span class="eyebrow">LATER</span><h2 style="margin:12px 0">${newer.age} 岁</h2><p>${esc(typeFor(newer.age).name)} <span class="delta">${newer.age-older.age>=0?'+':''}${newer.age-older.age} 岁</span></p></div></div><div class="card pad" style="margin:20px 0"><h3>六维度的此刻变化</h3>${DIMENSIONS.map(d=>`<div class="dim-row"><div class="dim-row-head"><span>${d.name}</span><span>${older.scores[d.id]} → ${newer.scores[d.id]} <span class="delta">${newer.scores[d.id]-older.scores[d.id]>=0?'+':''}${newer.scores[d.id]-older.scores[d.id]}</span></span></div><div class="bar"><i style="width:${newer.scores[d.id]}%"></i></div></div>`).join('')}</div><div class="note-box" style="margin-bottom:25px">结果变化可能与抽取的题目、当下情境和自我感受有关，不代表人格发生了确定性改变。</div><button class="btn" data-nav="history">← 返回记录</button>`}
  function settings(){return `${head('PRIVACY & HELP','设置与帮助','所有功能均可离线使用。你可以随时重新开始，或删除保存在本机的数据。')}<div class="grid-2" style="padding-bottom:75px"><div class="card pad"><h3>重新测评</h3><p>重新抽取 20 道题，旧结果仍保留在历史中，直到你主动删除。</p><button class="btn btn-primary" data-action="restart">开始新的一次</button></div><div class="card pad"><h3>隐私与存储</h3><p>没有账号、服务器或上传流程。答题进度与最近 20 次结果保存在当前浏览器的 localStorage。清除浏览器数据、使用无痕模式或更换设备，都可能使记录消失。</p><button class="btn" data-action="clear-all">删除所有本地数据</button></div><div class="card pad"><h3>这份测评是什么？</h3><p>它是基于生活情境选择制作的趣味自我探索工具，不是临床量表，也不能判断智力、疾病或人格障碍。年龄类型没有高低之分。</p><button class="btn btn-small" data-nav="atlas">浏览类型图鉴</button></div><div class="card pad"><h3>功能预览 · 演示模式</h3><p>深度维度分析、双次对比、成长任务和打印版报告在本地开放演示。当前没有付款系统，也不收集付款信息。</p><button class="btn btn-small" data-nav="history">查看本地对比</button></div></div>`}
  function defaultShare(){if(!current)return '';const x=interpretation(current);return `我在「🧠 你的心理年龄是多少岁？」测出了 ${current.age} 岁 · ${x.t.name}。\n${x.quote}\n测测你是哪一种心理年龄？来 MIND AGE CLUB 一起探索。\n#心理年龄 #趣味测评`}
  function anonymousShare(){if(!current)return '';const t=typeFor(current.age);return `我在「🧠 你的心理年龄是多少岁？」发现了自己的内心类型：${t.name}。\n${t.tag}。\n测测你是哪一种心理年龄？来 MIND AGE CLUB 一起探索。\n#心理年龄 #趣味测评`}
  function poster(){if(!current)return `<div class="empty"><h2>先完成测评，再制作海报</h2><button class="btn btn-primary" data-action="start">开始测评</button></div>`;if(!shareText)shareText=defaultShare();const t=typeFor(current.age);return `${head('SHARE YOUR STORY','把这一刻，分享出去','文字可以编辑，海报在你的浏览器中生成。分享内容仅在你主动复制或下载时离开本页面。')}<div class="poster-layout" style="padding-bottom:80px"><div><canvas class="poster-preview" id="posterCanvas" width="900" height="1200" role="img" aria-label="心理年龄结果海报预览"></canvas><p class="tiny">竖版 3:4 PNG · 本地绘制 · 不上传答案</p></div><div class="card pad"><span class="eyebrow">YOUR SHARE KIT</span><h2 style="font-size:2.1rem;margin:12px 0">${anonymous?esc(t.name):`${current.age} 岁 · ${esc(t.name)}`}</h2><p>${esc(t.summary)}</p><div class="summary-card" style="margin:18px 0"><span class="advanced-label">简洁结果摘要卡</span><div class="mini-age" style="font-size:1.7rem">${anonymous?esc(t.name):`${current.age} 岁 · ${esc(t.name)}`}</div><p>${esc(t.tag)}</p></div><label class="switch-row"><input id="anonymous" type="checkbox" ${anonymous?'checked':''}><span>匿名展示模式：隐藏具体年龄和分数</span></label><label class="field-label" for="shareText">分享文案 · 可以自由编辑</label><textarea class="field" id="shareText" rows="7">${esc(shareText)}</textarea><p class="tiny">邀请语：测测你是哪一种心理年龄？</p><div class="button-row"><button class="btn btn-primary" data-action="download">下载 PNG 海报</button><button class="btn" data-action="copy-share">复制文案</button><button class="btn" data-action="copy-summary">复制摘要卡</button></div><button class="btn-text" data-nav="report" style="margin-top:15px">← 返回报告</button></div></div>`}
  function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
  function wrapCanvas(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){let line='',lines=0;for(const char of String(text)){if(ctx.measureText(line+char).width>maxWidth&&line){ctx.fillText(line,x,y+lines*lineHeight);lines++;line=char;if(lines>=maxLines)return y+lines*lineHeight}else line+=char}if(line){ctx.fillText(line,x,y+lines*lineHeight);lines++}return y+lines*lineHeight}
  function drawPoster(){const canvas=document.getElementById('posterCanvas');if(!canvas||!current)return;const ctx=canvas.getContext('2d');if(!ctx){toast('当前浏览器无法绘制海报，可复制结果文案分享。');return}const r=current,t=typeFor(r.age);ctx.fillStyle='#f9f7f3';ctx.fillRect(0,0,900,1200);ctx.fillStyle='#e9e7f3';ctx.beginPath();ctx.arc(728,185,320,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f6e6e0';ctx.beginPath();ctx.arc(52,855,290,0,Math.PI*2);ctx.fill();roundRect(ctx,55,55,790,1090,38,'#fffefa');ctx.fillStyle='#665aa8';ctx.font='bold 28px "Microsoft YaHei",sans-serif';ctx.fillText('✦  MIND AGE CLUB',104,127);ctx.fillStyle='#65718a';ctx.font='24px "Microsoft YaHei",sans-serif';ctx.fillText('一场温柔的自我观察',105,166);ctx.strokeStyle='#e6e1e9';ctx.beginPath();ctx.moveTo(105,205);ctx.lineTo(795,205);ctx.stroke();ctx.fillStyle='#27324a';ctx.font='bold 32px "Microsoft YaHei",sans-serif';ctx.fillText('我的内心节奏',105,269);ctx.fillStyle='#665aa8';if(anonymous){ctx.font='bold 70px "Microsoft YaHei",sans-serif';wrapCanvas(ctx,t.name,105,370,690,88,2)}else{ctx.font='bold 172px "Microsoft YaHei",sans-serif';ctx.fillText(String(r.age),95,492);ctx.font='bold 48px "Microsoft YaHei",sans-serif';ctx.fillText('岁  ·  '+t.name,105,564)}ctx.fillStyle='#27324a';ctx.font='30px "Microsoft YaHei",sans-serif';const summaryY=anonymous?565:630;wrapCanvas(ctx,t.summary,105,summaryY,690,45,3);ctx.fillStyle='#6c5ea5';ctx.font='bold 23px "Microsoft YaHei",sans-serif';ctx.fillText('六个观察角度',105,740);let y=791;for(const d of DIMENSIONS){const idx=DIMENSIONS.indexOf(d),col=idx%2,row=Math.floor(idx/2),x=105+col*350,yy=y+row*88;roundRect(ctx,x,yy-29,315,65,16,'#f2f0f7');ctx.fillStyle='#27324a';ctx.font='23px "Microsoft YaHei",sans-serif';ctx.fillText(d.name,x+17,yy+11);ctx.textAlign='right';ctx.fillStyle='#665aa8';ctx.font='bold 22px "Microsoft YaHei",sans-serif';ctx.fillText(anonymous?'✦':`${r.scores[d.id]}/100`,x+295,yy+11);ctx.textAlign='left'}ctx.strokeStyle='#e6e1e9';ctx.beginPath();ctx.moveTo(105,1076);ctx.lineTo(795,1076);ctx.stroke();ctx.fillStyle='#65718a';ctx.font='20px "Microsoft YaHei",sans-serif';ctx.fillText('趣味分类 · 不等于临床心理评估',105,1112);ctx.textAlign='right';ctx.fillText('MIND AGE CLUB  ✦',793,1112);ctx.textAlign='left'}
  function downloadPoster(){const canvas=document.getElementById('posterCanvas');if(!canvas){toast('请先打开分享海报页。');return}try{drawPoster();canvas.toBlob(blob=>{if(!blob){toast('图片导出失败，请截图保存预览或复制文案。');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`心理年龄-${anonymous?'匿名':current.age+'岁'}-MIND-AGE-CLUB.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('海报已生成，正在下载。')},'image/png')}catch{toast('图片导出失败，请截图保存预览或复制文案。')}}
  async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);toast('已复制到剪贴板。');return}}catch{}const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.focus();input.select();try{if(document.execCommand('copy'))toast('已复制到剪贴板。');else toast('复制失败，请手动选中文案。')}catch{toast('复制失败，请手动选中文案。')}input.remove()}
  function printReport(){if(!current)return;const r=current,x=interpretation(r);const sections=`<h1>你的心理年龄：${r.age} 岁</h1><h2>${esc(x.t.name)}</h2><p>${esc(x.t.summary)}</p><p>${esc(x.quote)}</p><h2>六维度</h2><ul>${DIMENSIONS.map(d=>`<li>${d.name}：${r.scores[d.id]} / 100 — ${esc(r.scores[d.id]>=55?d.high:d.low)}</li>`).join('')}</ul><h2>你的优势</h2><ol>${x.strengths.map(v=>`<li>${esc(v)}</li>`).join('')}</ol><h2>值得留意</h2><ol>${x.blind.map(v=>`<li>${esc(v)}</li>`).join('')}</ol><h2>生活中的你</h2><p><b>亲密关系：</b>${esc(x.relation)}</p><p><b>工作学习：</b>${esc(x.work)}</p><p><b>面对压力：</b>${esc(x.stress)}</p><h2>三个成长建议</h2><ol>${x.advice.map(v=>`<li>${esc(v)}</li>`).join('')}</ol><p class="end">心理年龄是趣味化估算，不等于真实生理年龄、智力水平或临床心理评估结果。</p>`;const html=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>心理年龄报告 · MIND AGE CLUB</title><style>body{font:16px/1.75 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#27324a;max-width:760px;margin:35px auto;padding:0 28px}h1{font-size:40px;color:#665aa8}h2{border-bottom:1px solid #ddd;padding-bottom:7px;margin-top:32px}li{margin:7px 0}.brand{letter-spacing:.18em;font-size:12px;color:#665aa8}.end{border-top:1px solid #ddd;padding-top:18px;color:#667}@media print{button{display:none}body{margin:0;max-width:none}}</style></head><body><div class="brand">✦ MIND AGE CLUB</div><p>测评时间：${esc(dateLabel(r.date))} · 今日心情：${esc(r.mood)}</p>${sections}<button onclick="window.print()">打印 / 保存为 PDF</button></body></html>`;try{const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`心理年龄报告-${r.age}岁.html`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('独立报告 HTML 已下载；打开文件后可打印或保存为 PDF。')}catch{toast('报告下载失败，请使用浏览器打印当前页面。')}}
  function render(){let html;switch(view){case'notice':html=notice();break;case'quiz':html=quiz();break;case'confirm':html=confirm();break;case'reveal':html=reveal();break;case'report':html=report();break;case'atlas':html=atlas();break;case'history':html=historyPage();break;case'compare':html=comparison();break;case'poster':html=poster();break;case'settings':html=settings();break;default:html=home()}app.innerHTML=html;if(view==='poster')drawPoster()}
  document.querySelector('.site-header').addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav)show(nav.dataset.nav)});
  app.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){show(nav.dataset.nav);return}const option=e.target.closest('[data-option]');if(option&&session){const q=session.ids[session.index];session.answers[q]=Number(option.dataset.option);saveSession();app.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b===option)));return}const mood=e.target.closest('[data-mood]');if(mood){selectedMood=mood.dataset.mood;app.querySelectorAll('[data-mood]').forEach(b=>b.setAttribute('aria-pressed',String(b===mood)));return}const rec=e.target.closest('[data-record]');if(rec){current=byId(rec.dataset.record);taskDim=null;show('report');return}const del=e.target.closest('[data-delete]');if(del){const id=del.dataset.delete;dialog('删除这条记录？','删除后无法恢复。',()=>{history=history.filter(r=>r.id!==id);compare=compare.filter(v=>v!==id);if(current?.id===id)current=null;saveHistory();render();toast('记录已删除。')},'删除');return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case'start':if(session){dialog('开始新的测评？','当前未完成的进度将被替换，已保存的历史结果不会删除。',()=>{selectedMood='平静';show('notice')},'继续');}else{selectedMood='平静';show('notice')}break;case'resume':if(session)show('quiz');else show('notice');break;case'begin':if(newSession(selectedMood))show('quiz');break;case'exit':show('home');break;case'previous':if(session&&session.index>0){session.index--;saveSession();show('quiz')}break;case'next':if(!session)return;{let q=session.ids[session.index];if(!Number.isInteger(session.answers[q])){toast('先选择一个最接近你的答案。');return}if(session.index===19){show('confirm')}else{session.index++;saveSession();show('quiz')}}break;case'edit':if(session){session.index=19;saveSession();show('quiz')}break;case'finish':finish();break;case'restart':dialog('开启新的一次测评？','新的测评将替换未完成的答题进度；已有结果仍保留在历史里。',()=>{selectedMood='平静';show('notice')},'开始');break;case'copy-result':copyText(defaultShare());break;case'copy-friend':{const t=typeFor(current.age);copyText(`我测出了「${t.name}」。如果你用三个词形容我在情绪、关系或做决定时的样子，会选哪三个？`)}break;case'compare':if(compare.length===2)show('compare');break;case'clear-history':dialog('清空全部历史记录？','这会永久删除本机保存的测评结果，无法恢复。',()=>{history=[];current=null;compare=[];saveHistory();render();toast('历史记录已清空。')},'清空记录');break;case'clear-all':dialog('删除所有本地数据？','答题进度和全部历史结果都会从当前浏览器删除，无法恢复。',()=>{session=null;current=null;history=[];compare=[];safeStore.remove(STORAGE.session);safeStore.remove(STORAGE.history);show('home');toast('本地数据已删除。')},'全部删除');break;case'download':downloadPoster();break;case'copy-share':copyText(shareText);break;case'copy-summary':{const t=typeFor(current.age);copyText(anonymous?`我的心理年龄类型：${t.name}。${t.tag}。测测你是哪一种心理年龄？`:`我的趣味心理年龄：${current.age} 岁 · ${t.name}。${t.tag}。测测你是哪一种心理年龄？`)}break;case'save-self-age':{const input=document.getElementById('selfAge'),n=Number(input.value);if(!Number.isInteger(n)||n<1||n>120){toast('请输入 1–120 之间的整数。');return}current.selfAge=n;const stored=byId(current.id);if(stored)stored.selfAge=n;saveHistory();render();toast('自评已保存到本地记录。')}break;case'print':printReport();break;default:break}});
  app.addEventListener('change',e=>{if(e.target.id==='taskDimension'){taskDim=e.target.value;render()}if(e.target.id==='anonymous'){if(e.target.checked){fullShareText=document.getElementById('shareText')?.value||shareText;shareText=anonymousShare();anonymous=true}else{shareText=fullShareText||defaultShare();anonymous=false}render()}if(e.target.matches('[data-compare-id]')){const id=e.target.dataset.compareId;if(e.target.checked){if(compare.length>=2){e.target.checked=false;toast('最多选择两次记录进行对比。');return}compare.push(id)}else compare=compare.filter(v=>v!==id);const b=app.querySelector('[data-action="compare"]');if(b)b.disabled=compare.length!==2}});
  app.addEventListener('input',e=>{if(e.target.id==='shareText')shareText=e.target.value});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialogRoot.innerHTML){dialogRoot.innerHTML='';return}if(view!=='quiz'||!session||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();app.querySelector(`[data-option="${Number(e.key)-1}"]`)?.click()}else if(e.key==='ArrowLeft'){e.preventDefault();app.querySelector('[data-action="previous"]')?.click()}else if(e.key==='ArrowRight'){e.preventDefault();app.querySelector('[data-action="next"]')?.click()}});
  render();
